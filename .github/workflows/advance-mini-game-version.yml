name: Advance mini game version

on:
  push:
    branches:
      - main
    paths-ignore:
      - mini-game-version.json

permissions:
  contents: write

concurrency:
  group: mini-game-version-main
  cancel-in-progress: false

jobs:
  advance:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip version]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Advance version file
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("mini-game-version.json")
          data = {}

          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))

          major = int(data.get("major", 1))
          minor = int(data.get("minor", 1)) + 1
          version = f"v{major}.{minor}"

          path.write_text(
              json.dumps(
                  {
                      "major": major,
                      "minor": minor,
                      "version": version,
                      "updatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                      "sourceCommit": os.environ["GITHUB_SHA"][:7],
                      "note": "Auto-bumped by GitHub Actions after normal pushes to main."
                  },
                  indent=2
              )
              + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit version bump
        run: |
          set -euo pipefail

          if git diff --quiet -- mini-game-version.json; then
            echo "No version change needed."
            exit 0
          fi

          version="$(python3 -c 'import json; print(json.load(open("mini-game-version.json", encoding="utf-8"))["version"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mini-game-version.json
          git commit -m "Advance mini game version to ${version} [skip version]"
          git push
